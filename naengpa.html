<title>냉파를 부탁해</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, centered on laptop. Sticky header, floating glass composer. */
:root {
  --bg: #F5F5F7; --card: #FFFFFF; --line: #E5E5EA; --hair: #EEEEF2; --tile: #F0F0F4; --chip: #EEEEF2; --chip-ink: #3A3A3C;
  --ink: #1D1D1F; --sub: #6E6E73; --mute: #8E8E93; --faint: #AEAEB2; --chev: #C4C4C7;
  --accent: #D77E01; --on-accent: #FFFFFF; --red: #D70F2B;
  --inv: #1D1D1F; --inv-ink: #FFFFFF; --inv-sub: rgba(255,255,255,.6); --inv-btn: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.9); --glass-hi: rgba(255,255,255,.95);
  --bubble: #E6E6EB; --seg: #E8E8ED; --seg-on: #FFFFFF;
  --loc-fridge: #8E8E93; --loc-freezer: #3A7BF0; --loc-room: #A47A4F;
  --receipt-dash: #CFCFCB;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.shell { max-width: 820px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.view { padding-bottom: 112px; }
.view[hidden] { display: none !important; }

.glass { border: 0.5px solid var(--glass-edge); background: var(--glass); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 0.5px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
.gbtn { flex: none; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 10px; min-height: 64px; padding-block: 10px; }
.top h1 { margin: 0; flex: 1; min-width: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { flex: none; width: 36px; height: 44px; margin: 0 -6px 0 -10px; border: 0; background: none; color: var(--mute); display: flex; align-items: center; justify-content: center; padding: 0; }
.hello { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; padding-left: 4px; }
.hello small { font-size: 12.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hello b { font-size: 21px; font-weight: 800; letter-spacing: -0.04em; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand .logo { flex: none; }
.kit { display: flex; align-items: center; gap: 1px; margin-left: 2px; min-width: 0; }
.kt { position: relative; flex: none; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--faint); display: flex; align-items: center; justify-content: center; cursor: default; }
.kt:hover, .kt:focus-visible, .kt.on { color: var(--sub); background: var(--seg); outline: none; }
.kt .tip { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 5px 9px; border-radius: 8px; background: var(--ink); color: var(--card); font-size: 11.5px; font-weight: 500; letter-spacing: 0; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 30; }
.kt:hover .tip, .kt:focus-visible .tip, .kt.on .tip { opacity: 1; }

.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.h2 { margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: var(--sub); }
.qchip { flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--chip); color: var(--chip-ink); font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0; white-space: nowrap; }
.tile { flex: none; border-radius: 11px; background: var(--tile); display: flex; align-items: center; justify-content: center; }
.ico { display: block; flex: none; }
.faded { position: relative; }
.faded::after { content: ""; position: absolute; top: -2px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 1.5px var(--card); }
.tile.faded::after { top: -3px; right: -3px; width: 10px; height: 10px; box-shadow: 0 0 0 2px var(--card); }
.d-red { color: var(--red); font-weight: 600; }
.d-ink { color: var(--ink); font-weight: 500; }
.d-mute { color: var(--mute); }
.chev { flex: none; color: var(--chev); }
.loc { flex: none; display: inline-flex; }
.loc-냉장 { color: var(--loc-fridge); } .loc-냉동 { color: var(--loc-freezer); } .loc-실온 { color: var(--loc-room); }

/* Home */
.rec { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; background: var(--inv); border-radius: 18px; color: var(--inv-ink); box-shadow: 0 6px 18px rgba(0,0,0,.14); }
.rec .stack-ico { display: flex; }
.rec .bub { width: 34px; height: 34px; border-radius: 17px; background: #F5F5F7; box-shadow: 0 0 0 2px var(--inv); display: flex; align-items: center; justify-content: center; }
.rec .bub + .bub { margin-left: -8px; }
.rec .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rec .meta { font-size: 12px; color: var(--inv-sub); }
.rec .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .dice { flex: none; width: 36px; height: 36px; border: 0; border-radius: 18px; background: var(--inv-btn); color: var(--inv-ink); display: flex; align-items: center; justify-content: center; padding: 0; }
.rec .dice[disabled] { opacity: .6; cursor: default; }
.rec .go { flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 14px; border: 0; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.cat { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.cat-h { display: flex; align-items: baseline; gap: 5px; }
.cat-h h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-h span { font-size: 12px; color: var(--faint); }
.top-item { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0; border: 0; background: none; text-align: left; }
.top-item .tile { width: 52px; height: 52px; border-radius: 16px; }
.top-item .n { font-size: 15px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.top-item .d { font-size: 12.5px; }
.backup { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 2px auto 0; padding: 8px 12px; border: 0; border-radius: 12px; background: none; color: var(--sub); font-size: 13px; }
.backup small { color: var(--faint); font-size: 12px; }
.backup:hover { color: var(--ink); background: var(--seg); }
.rest { display: flex; flex-direction: column; border-top: 1px solid var(--hair); padding-top: 4px; }
.rest-row { display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 0; border: 0; background: none; text-align: left; }
.rest-row .n { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest-row .d { flex: none; font-size: 12px; }
.more { display: flex; align-items: center; min-height: 28px; padding: 0 0 0 27px; border: 0; background: none; font-size: 12px; color: var(--sub); text-align: left; }
.calm { overflow: hidden; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.calm-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 0; background: none; text-align: left; }
.calm-row { box-shadow: 0 -1px 0 var(--hair), -1px 0 0 var(--hair); }
.calm-row .bubs { display: flex; }
.calm-row .bub { width: 28px; height: 28px; border-radius: 14px; background: var(--tile); box-shadow: 0 0 0 2px var(--card); display: flex; align-items: center; justify-content: center; }
.calm-row .bub + .bub { margin-left: -7px; }
.calm-row .n { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calm-row .c { flex: none; font-size: 12.5px; color: var(--mute); }
.main4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.cat-h { padding: 0; border: 0; background: none; text-align: left; }
.calm-row { align-items: center; padding: 10px 14px; min-height: 58px; }
.calm-row > .bub { flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--tile); display: flex; align-items: center; justify-content: center; box-shadow: none; }
.calm-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.calm-row .pv { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calm-row .pv em { font-style: normal; color: var(--red); font-weight: 500; }
.subs { display: flex; gap: 2px; margin: -6px -14px 0; padding: 0 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.subs::-webkit-scrollbar { display: none; }
.sub-btn { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; border: 0; background: none; font-size: 13.5px; font-weight: 500; color: var(--mute); box-shadow: inset 0 -2px 0 transparent; }
.sub-btn span { color: var(--faint); font-size: 12px; font-weight: 400; }
.sub-btn:hover { color: var(--ink); }
.sub-btn[aria-pressed="true"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.sub-btn[aria-pressed="true"] span { color: var(--accent); font-weight: 500; }
.more-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 6px; }
.more-nav button { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 58px; padding: 0 12px; border: 0; background: none; text-align: left; }
.more-nav button + button { border-left: 1px solid var(--line); }
.more-nav .mi { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--seg); color: var(--chip-ink); display: flex; align-items: center; justify-content: center; }
.more-nav .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.more-nav .t b { font-size: 14.5px; font-weight: 500; }
.more-nav .t small { font-size: 12px; color: var(--mute); }
.empty { padding: 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.empty b { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.empty p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub); }
.empty .ex { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); font-size: 13.5px; color: var(--ink); text-align: left; }
.pill.acc { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* Composer */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-top: 28px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 55%); }
.dock .shell { display: flex; flex-direction: column; gap: 6px; }
.dock .shell > * { pointer-events: auto; }
.composer { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; border-radius: 26px; }
.composer input { flex: 1; min-width: 0; height: 40px; padding: 0 6px 0 2px; border: 0; outline: 0; background: transparent; font-size: 16px; line-height: 40px; letter-spacing: -0.02em; }
.composer .cam { width: 40px; height: 40px; border-radius: 20px; color: var(--sub); }
.composer .cam[hidden] ~ input { padding-left: 14px; }
.composer .cam:hover { background: var(--tile); color: var(--ink); }
.composer input::placeholder { color: var(--faint); }
.icon-btn { flex: none; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); }
.send { flex: none; width: 36px; height: 36px; border: 0; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .15s, color .15s; }
.send.idle { background: var(--seg); color: var(--faint); }
.send[disabled] { opacity: .45; cursor: default; }
.attach { display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 6px 6px 10px; border-radius: 14px; font-size: 13px; color: var(--sub); }
.sugs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: -6px -14px 0; padding: 6px 14px 4px; }
.sugs::-webkit-scrollbar { display: none; }
.sug { flex: none; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12.5px; color: var(--chip-ink); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 0.5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05); }

/* All */
.sum { display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 2px; }
.sum-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.sum-row strong { font-weight: 600; color: var(--ink); }
.sum-row .r { color: var(--red); }
.bar { display: flex; gap: 2px; height: 6px; }
.bar span { display: block; border-radius: 3px; }
.modes { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.modes > span { font-size: 12.5px; color: var(--mute); margin-right: 2px; }
.seg-btn { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--chip-ink); }
.seg-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.group { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: calc(76px + env(safe-area-inset-top, 0px)); }
.group-h { display: flex; align-items: center; gap: 6px; padding: 0 4px; }
.group-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
.group-h h2.r { color: var(--red); }
.group-h span { font-size: 12px; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 34px; padding: 0 10px 0 7px; border: 1px solid var(--line); border-radius: 17px; background: var(--card); }
.ichip .n { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ichip .n.gone { color: var(--mute); }
.ichip .q { flex: none; font-size: 12px; color: var(--mute); white-space: nowrap; }
.ichip .sep { flex: none; width: 1px; height: 12px; background: var(--line); }
.ichip .d { flex: none; font-size: 12px; white-space: nowrap; }
.ichip .st { flex: none; font-size: 11px; color: var(--faint); }
.st-h { display: flex; align-items: center; gap: 6px; margin: 8px 2px 2px; font-size: 12px; color: var(--faint); }
.st-h::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.seas { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; }
.seas .ichip { height: 32px; }
.seas .ichip .q { color: var(--sub); }
.miss { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.miss .l { display: flex; flex-wrap: wrap; gap: 6px; }
.miss .l span { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; border: 1px dashed var(--line); font-size: 13px; color: var(--chip-ink); }
.miss small { font-size: 12px; color: var(--mute); }
.kit { padding: 4px 0; }
.kit .krow { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 8px 0 14px; }
.kit .krow + .krow { border-top: 1px solid var(--hair); }
.kit .krow .n { flex: 1; min-width: 0; font-size: 15px; }
.kit .krow .del { flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: none; color: var(--faint); display: flex; align-items: center; justify-content: center; padding: 0; }
.kadd { display: flex; gap: 8px; }
.kadd input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--card); font: inherit; font-size: 15px; color: var(--ink); }
.kadd button { flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: var(--ink); color: var(--card); font: inherit; font-size: 14px; font-weight: 600; }
.kadd button[disabled] { opacity: .35; }
.note { margin: 0; padding: 0 4px; font-size: 12.5px; line-height: 1.6; color: var(--mute); }
button.ichip { font: inherit; color: inherit; cursor: pointer; text-align: left; }
button.ichip:active, button.row:active, .idea:active { background: var(--hair); }

/* Ideas (one ingredient -> dishes) */
.ing-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.ing-head .tile { width: 44px; height: 44px; }
.ing-head .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ing-head .n { font-size: 16px; font-weight: 600; }
.ing-head .l2 { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--mute); }
.idea { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; background: none; text-align: left; font: inherit; color: inherit; }
.idea + .idea { border-top: 1px solid var(--hair); }
.idea .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.idea .nm { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.idea .nm b { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idea .nm small { flex: none; font-size: 12px; color: var(--mute); }
.idea .x { font-size: 13px; line-height: 1.5; color: var(--chip-ink); }
.idea .ings { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--mute); }
.idea .ings span { display: inline-flex; align-items: center; gap: 3px; }
.idea .ings .lead { color: var(--faint); }
.sk { display: block; height: 11px; border-radius: 6px; background: var(--seg); animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.morebtn { align-self: center; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); font: inherit; font-size: 13.5px; color: var(--chip-ink); }
.morebtn[disabled] { opacity: .5; }

/* Meals (what I cooked) */
.meal .stack-ico { flex: none; display: flex; width: 52px; }
.meal .bub { width: 30px; height: 30px; border-radius: 15px; background: var(--tile); box-shadow: 0 0 0 2px var(--card); display: flex; align-items: center; justify-content: center; }
.meal .bub + .bub { margin-left: -8px; }
.meal .kc { flex: none; font-size: 12px; color: var(--mute); }
.meal .del { flex: none; width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: var(--faint); display: flex; align-items: center; justify-content: center; padding: 0; }
.meal-sum { display: flex; gap: 16px; padding: 0 4px; font-size: 13px; color: var(--sub); }
.meal-sum strong { color: var(--ink); font-weight: 600; }

/* Rows (search, recipe) */
.rows { overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; background: none; text-align: left; }
.row + .row { border-top: 1px solid var(--hair); }
.row .tile { width: 36px; height: 36px; }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .n { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l2 { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--mute); }
.row .d { flex: none; font-size: 12.5px; }

async function logEvents(evs) {
  if (!evs.length) return;
  const byMonth = {};
  for (const e of evs) { const k = monthKey(new Date(e.ts)); (byMonth[k] = byMonth[k] || []).push(e); }
  for (const k of Object.keys(byMonth)) {
    await serial(async () => {
      const ref = S.db.doc('events/' + k);
      const snap = await ref.get();
      const list = snap.exists ? (snap.data().list || []).slice() : [];
      list.push(...byMonth[k]);
      await ref.set({ list: list });
    });
  }
}
async function dropEvents(ids) {
  const set = new Set(ids);
  const keys = Object.keys(S.months);
  for (const k of keys) {
    await serial(async () => {
      const ref = S.db.doc('events/' + k);
      const snap = await ref.get();
      if (!snap.exists) return;
      const list = (snap.data().list || []).filter((e) => !set.has(e.id));

}
const evOf = (kind, it, from, to, src) => ({ id: uid(), ts: Date.now(), kind: kind, itemId: it.id, name: it.name, icon: iconOf(it), from: from ?? null, to: to ?? null });

// change = {itemId, before, after, eventId}
async function applyAdd(list, src) {
  const changes = [], evs = [];
  for (const raw of list) {
    const it = normalizeNew(raw);
    const old = S.items.find((x) => x.staple && x.name === it.name && needBuy(x));
    if (old) {
      const before = cleanItem(old);
      const after = Object.assign({}, before, { qty: it.qty, due: it.due || null, bought: it.bought, memo: it.memo || before.memo || '' });
      await itemRef(old.id).set(after);
      const ev = evOf('add', Object.assign({ id: old.id }, after), null, it.qty, src);
      evs.push(ev);
      changes.push({ itemId: old.id, before: before, after: after, eventId: ev.id, name: after.name, icon: iconOf(after), loc: after.loc, due: after.due, kind: 'add', qty: after.qty });
      continue;
    }
    const ref = S.db.collection('items').doc();
    it.id = ref.id;
    await ref.set(cleanItem(it));
    const ev = evOf('add', it, null, it.qty, src);
    evs.push(ev);
    changes.push({ itemId: it.id, before: null, after: cleanItem(it), eventId: ev.id, name: it.name, icon: iconOf(it), loc: it.loc, due: it.due, kind: 'add', qty: it.qty });
  }
  await logEvents(evs);
  return changes;
}
function normalizeNew(r) {

    memo: String(r.memo || '').trim().slice(0, 60),
    cat: cat,
    icon: ICONS[r.icon] ? r.icon : CAT[cat].icon,
    loc: LOCS.includes(r.loc) ? r.loc : '냉장',
    qty: String(r.qty || '').trim().slice(0, 20) || '1개',
    due: parseYmd(r.due) ? ymd(parseYmd(r.due)) : null,
    bought: parseYmd(r.bought) ? ymd(parseYmd(r.bought)) : todayStr(),

}

  for (const c of changes.slice().reverse()) {

  if (v === 'home') renderHome();
  else if (v === 'all') renderAll();
  else if (v === 'log') renderLog();
  else if (v === 'search') renderSearch();

function greet() {

}

function fitGrid() {
  const g = document.querySelector('#home-body .grid2'); if (!g) return;
  const n = g.children.length, w = g.clientWidth || 360;
  const max = Math.max(2, Math.min(n, Math.floor((w + 10) / 170)));
  let best = 2, waste = 99;
  for (let c = 2; c <= max; c++) { const e = Math.ceil(n / c) * c - n; if (e <= waste) { best = c; waste = e; } }
  g.style.gridTemplateColumns = 'repeat(' + best + ', minmax(0, 1fr))';
}
window.addEventListener('resize', fitGrid);

function renderAll() {
  const el = $('all-body');
  const items = S.items.slice().sort((a, b) => sortKey(a) - sortKey(b));
  if (!items.length) { el.innerHTML = '<div class="card empty"><b>재고가 비어 있어요</b><p>아래 입력창에 산 것을 적거나 주문 캡처를 보내면 여기에 모여요.</p></div>'; return; }
  const urgent = items.filter((it) => sortKey(it) <= 1).length;
  const week = items.filter((it) => { const k = sortKey(it); return k >= 2 && k <= 7; }).length;
  const later = items.length - urgent - week;
  let h = '<section class="sum" aria-label="한눈에 보기"><div class="sum-row"><span><strong class="r">' + urgent + '</strong> 오늘·내일</span><span><strong>' + week + '</strong> 이번 주</span><span><strong>' + later + '</strong> 여유</span><span style="flex:1"></span><span>전체 ' + items.length + '개</span></div>';
  h += '<div class="bar" aria-hidden="true"><span style="flex:' + urgent + ' 1 0;background:var(--red)"></span><span style="flex:' + week + ' 1 0;background:var(--sub)"></span><span style="flex:' + later + ' 1 0;background:var(--line)"></span></div></section>';
  h += '<div class="modes" role="group" aria-label="묶어 보기"><span>묶어 보기</span>' + [['cat', '종류'], ['due', '기한'], ['loc', '보관']].map((m) => '<button class="seg-btn" data-mode="' + m[0] + '" aria-pressed="' + (S.allMode === m[0]) + '">' + m[1] + '</button>').join('') + '</div>';
  let defs;
  if (S.allMode === 'due') defs = [
    { id: 'd1', name: '오늘·내일까지', red: true, test: (it) => sortKey(it) <= 1 },
    { id: 'd7', name: '이번 주', test: (it) => { const k = sortKey(it); return k >= 2 && k <= 7; } },
    { id: 'd30', name: '이번 달', test: (it) => { const k = sortKey(it); return k >= 8 && k <= 30; } },
    { id: 'dlong', name: '한 달 넘게 여유', test: (it) => { const k = sortKey(it); return k > 30 && k < 99999; } },
    { id: 'dnone', name: '기한 없음', test: (it) => sortKey(it) === 99999 }
  ];
  else if (S.allMode === 'loc') defs = LOCS.map((l) => ({ id: l, name: l, loc: l, test: (it) => (LOCS.includes(it.loc) ? it.loc : '냉장') === l }));
  else defs = CATS.map((c) => ({ id: c.id, name: c.name, test: (it) => (CAT[it.cat] ? it.cat : 'etc') === c.id }));
  const counted = defs.map((g) => Object.assign({}, g, { list: items.filter(g.test) })).filter((g) => g.list.length);
  const sel = S.allSel;
  h += '<div class="subs" role="tablist" aria-label="세부 항목"><button class="sub-btn" data-sub="" aria-pressed="' + (sel.size === 0) + '">전체</button>' + counted.map((g) => '<button class="sub-btn" data-sub="' + esc(g.id) + '" aria-pressed="' + sel.has(g.id) + '">' + (g.loc ? locIcon(g.loc, 12) : '') + esc(g.name) + ' <span>' + g.list.length + '</span></button>').join('') + '</div>';
  for (const g of counted) {
    if (sel.size && !sel.has(g.id)) continue;
    const list = S.allMode === 'cat' ? g.list.filter((it) => !it.staple).concat(g.list.filter((it) => it.staple)) : g.list;
    const nFresh = list.filter((it) => !it.staple).length;
    h += '<section class="group" aria-label="' + esc(g.name) + '"><div class="group-h">' + (g.loc ? locIcon(g.loc, 15) : '') + '<h2' + (g.red ? ' class="r"' : '') + '>' + esc(g.name) + '</h2><span>' + list.length + '</span></div><div class="chips">';
    list.forEach((it, k) => {
      if (S.allMode === 'cat' && it.staple && k === nFresh) h += '</div><div class="st-h">상비 ' + (list.length - nFresh) + '</div><div class="chips">';

const ACT = { add: '추가', eat: '먹음', eatAll: '다 먹음', discard: '버림', edit: '수정' };
function renderLog() {
  const el = $('log-body');
  const evs = allEvents();
  if (!evs.length) { el.innerHTML = '<div class="card empty"><b>아직 기록이 없어요</b><p>재료를 넣거나 먹었다고 말하면 날짜별 영수증처럼 쌓여요.</p></div>'; return; }
  const days = [];
  for (const e of evs) { const k = ymd(new Date(e.ts)); let d = days.find((x) => x.k === k); if (!d) { d = { k: k, list: [] }; days.push(d); } d.list.push(e); }
  let h = '';
  for (const d of days) {
    const dt = parseYmd(d.k);
    const diff = Math.round((parseYmd(todayStr()) - dt) / 864e5);
    const title = diff === 0 ? '오늘' : diff === 1 ? '어제' : diff < 7 ? diff + '일 전' : Math.floor(diff / 7) + '주 전';
    const stamp = d.k.replace(/-/g, '.') + ' ' + WD[dt.getDay()];
    const cnt = {}; for (const e of d.list) cnt[e.kind] = (cnt[e.kind] || 0) + 1;
    const total = ['add', 'eat', 'eatAll', 'discard', 'edit'].filter((k) => cnt[k]).map((k) => (ACT[k] || k) + ' ' + cnt[k]).join(' · ');
    h += '<article class="receipt" aria-label="' + esc(title) + ' 기록"><div class="paper"><div class="head"><h2>' + esc(title) + '</h2><span>' + esc(stamp) + '</span></div><div class="lines">';
    for (const e of d.list.slice().sort((a, b) => a.ts - b.ts)) {
      const bad = e.kind === 'discard';
      const q = e.kind === 'add' ? '+' + (e.to || '') : e.kind === 'discard' ? (e.from || '') : (e.from && e.to ? e.from + '→' + e.to : (e.to || e.from || ''));
      h += '<div class="rline' + (bad ? ' bad' : '') + '"><div class="a"><span class="t">' + hm(e.ts) + '</span><span class="k">' + (ACT[e.kind] || e.kind) + '</span><span class="n">' + esc(e.name) + '</span><span class="q">' + esc(q) + '</span></div></div>';
    }
    h += '</div><div class="total">' + esc(total) + '</div></div><div class="teeth" aria-hidden="true"></div></article>';
  }
  el.innerHTML = h;
}

const FILTERS = [

  { id: 'over', t: '기한 지남', test: (it) => { const d = dueD(it); return d != null && d < 0; } },
  { id: 'week', t: '이번 주', test: (it) => { const d = dueD(it); return d != null && d >= 0 && d <= 7; } },
  { id: 'frz', t: '냉동실', test: (it) => it.loc === '냉동' },

    return;
  }
  let h = '<section class="stack" style="gap:6px"><h2 class="h2">재고 ' + list.length + '</h2><div class="card rows">';

    h += '<button class="row" data-ing="' + esc(it.id) + '"><span class="tile' + (d != null && d < 0 ? ' faded' : '') + '">' + icon(iconOf(it), 22) + '</span><span class="mid"><span class="l1"><span class="n">' + nm + '</span><span class="qchip">' + esc(it.qty || '') + '</span></span><span class="l2">' + locIcon(it.loc, 13) + esc(it.loc || '냉장') + (it.memo ? ', ' + esc(it.memo) : '') + (it.bought ? ', ' + mdText(it.bought) + ' 삼' : '') + '</span></span><span class="d ' + (isOut(it) ? 'd-red' : dcls(d)) + '">' + (isOut(it) ? '다 씀' : dl(d)) + '</span></button>';
  }
  h += '</div></section>';
  el.innerHTML = h;
}

function turnsFor(text, hasImage) {
  const turns = [{ role: 'user', content: RULES() }];
  for (const m of S.chat.slice(-12)) {
    let c = m.text || '';
    if (m.role === 'user' && m.image) c = '[이미지 보냄: ' + m.image + '] ' + c;
    if (m.role === 'assistant') for (const w of (m.widgets || [])) {
      if (w.type === 'propose') c += ' [확인 위젯: ' + w.items.map((x) => x.name + ' ' + x.qty).join(', ') + ' / 상태: ' + (w.state === 'added' ? '넣음' : w.state === 'undone' ? '되돌림' : '대기') + ']';
      if (w.type === 'done') c += ' [반영: ' + w.changes.map((x) => x.name).join(', ') + (w.undone ? ' / 되돌림' : '') + ']';
    }
    c = c.trim();
    if (c) turns.push({ role: m.role === 'user' ? 'user' : 'assistant', content: c });
  }
  turns.push({ role: 'user', content: (hasImage ? '[주문 내역 캡처나 영수증 이미지를 보냈어. 식재료를 읽어서 proposeItems로 보여줘.] ' : '') + (text || '') });
  return turns;
}

async function send(text, file) {
  text = (text || '').trim();
  if (S.busy || (!text && !file) || !S.sample || !S.db) return;
  S.busy = true; $('send').disabled = true;
  if (S.view !== 'chat') go('chat');
  const userMsg = { id: uid(), role: 'user', ts: Date.now(), text: text, image: file ? (file.name && file.name.length < 40 ? file.name : '이미지 1장') : '' };
  const bot = { id: uid(), role: 'assistant', ts: Date.now(), text: '', pending: true, widgets: [], status: file ? '이미지를 읽는 중…' : '생각하는 중…' };
  S.live = { user: userMsg, bot: bot };
  renderChat(); window.scrollTo(0, document.body.scrollHeight);
  const ctx = { changes: [], proposal: null, recipe: null, src: file ? '사진' : '대화', status: (t) => { bot.status = t; renderChat(); } };
  const turns = turnsFor(text, !!file);
  S.ctl = new AbortController();
  try {
    const opts = { tools: makeTools(ctx), signal: S.ctl.signal, modelTier: file ? 'default' : 'quick', onText: ({ text: t }) => { bot.text = t.trim(); renderChat(); window.scrollTo(0, document.body.scrollHeight); } };
    if (file) opts.images = [file];
    const res = await S.sample(turns, opts);
    bot.text = res.text.trim();
  } catch (e) {
    bot.text = (e && e.text ? e.text.trim() : '');
    if (!e || e.code !== 'cancelled') bot.error = errText(e);
    if (e && (e.code === 'images_unavailable')) { S.caps = Object.assign({}, S.caps, { images: null }); $('cam').hidden = true; }
  }
  delete bot.pending; delete bot.status;
  if (ctx.changes.length) bot.widgets.push({ id: uid(), type: 'done', changes: ctx.changes, undone: false });
  if (ctx.proposal) bot.widgets.push(ctx.proposal);
  if (ctx.recipe) bot.recipe = ctx.recipe;
  if (!bot.text && !bot.widgets.length && !bot.error) bot.text = '반영했어요.';
  S.live = null;
  try { await saveChat(S.chat.concat([userMsg, bot])); } catch (e) { S.chat = S.chat.concat([userMsg, bot]); }
  S.busy = false; $('send').disabled = false;
  renderChat(); window.scrollTo(0, document.body.scrollHeight);
}

function findWidget(mid, wid) {
  const m = S.chat.find((x) => x.id === mid);
  const w = m && (m.widgets || []).find((x) => x.id === wid);
  return { m: m, w: w };
}
async function widgetAct(act, mid, wid, i) {
  const msgs = JSON.parse(JSON.stringify(S.chat));
  const m = msgs.find((x) => x.id === mid); if (!m) return;
  const w = (m.widgets || []).find((x) => x.id === wid); if (!w) return;
  if (act === 'toggle') {
    const off = new Set(w.off || []); off.has(i) ? off.delete(i) : off.add(i); w.off = [...off];
    S.chat = msgs; renderChat(); saveChat(msgs).catch(() => {}); return;
  }
  if (act === 'accept' && w.state === 'pending') {
    const off = new Set(w.off || []);
    const list = w.items.filter((_, k) => !off.has(k));
    w.state = 'saving'; S.chat = msgs; renderChat();
    try { w.changes = await applyAdd(list, w.src || '사진'); w.state = 'added'; toast(list.length + '개를 넣었어요'); }
    catch (e) { w.state = 'pending'; toast('넣지 못했어요. 다시 눌러 주세요.'); }
    await saveChat(msgs).catch(() => {}); renderChat(); return;
  }
  if (act === 'undo') {
    const changes = w.type === 'propose' ? (w.changes || []) : w.changes;
    try { await undoChanges(changes); } catch (e) { toast('되돌리지 못했어요.'); return; }
    if (w.type === 'propose') w.state = 'undone'; else w.undone = true;
    toast('되돌렸어요');
    await saveChat(msgs).catch(() => {}); renderChat();
  }
}

// ---------- recipe ----------
function toRecipe(r) {
  const short = (v) => String(v || '').trim().slice(0, 14);
  const uses = (Array.isArray(r.uses) ? r.uses : []).map((u) => { const it = S.items.find((x) => x.id === String(u.id)); return it ? { id: it.id, name: it.name, icon: iconOf(it), due: it.due, cat: it.cat, staple: !!it.staple, use: short(u.use), after: short(u.after) } : null; }).filter(Boolean);
  const missing = (Array.isArray(r.missing) ? r.missing : []).map((m) => typeof m === 'string' ? { name: m.slice(0, 20), use: '' } : { name: String(m.name || '').slice(0, 20), use: short(m.use) }).filter((m) => m.name).slice(0, 8);
  const tools = (Array.isArray(r.tools) ? r.tools : []).map((t) => String(t).trim().slice(0, 16)).filter(Boolean).slice(0, 3);
  const n = r.nutrition && typeof r.nutrition === 'object' ? r.nutrition : {};
  const num = (v) => { const x = Math.round(Number(v)); return isFinite(x) && x > 0 ? x : null; };
  let pantry = String(r.pantry || '');
  for (const it of S.items) if (it.id && pantry.includes(it.id)) pantry = pantry.split(it.id).join(it.name);
  pantry = pantry.replace(/\(\s*id\s+([^)]*)\)/gi, '($1)').replace(/\s{2,}/g, ' ').trim();
  return { name: String(r.name || '오늘의 메뉴').slice(0, 40), minutes: Number(r.minutes) || null, servings: String(r.servings || '1인분'), level: String(r.level || ''), why: String(r.why || ''), uses: uses, pantry: pantry, missing: missing, tools: tools, steps: (Array.isArray(r.steps) ? r.steps : []).map(String).slice(0, 12), kcal: num(r.kcal), nutrition: { carbs: num(n.carbs), protein: num(n.protein), fat: num(n.fat), sodium: num(n.sodium) }, cooked: false };
}

    : '위 재고로 오늘 저녁 1인분 메뉴 하나를 골라 줘. 기한이 가까운 재료를 우선 써.' + (prev ? ' 방금 추천한 "' + prev + '" 말고 다른 메뉴로.' : '');

async function genIdeas(id, more) {
  const it = S.items.find((x) => x.id === id);

  const cur = S.ideas[id] || { list: [] };
  if (cur.busy) return;
  S.ideas[id] = { list: more ? cur.list : [], busy: true, err: '' };
  render();
  const shown = more ? cur.list.map((x) => x.name) : [];
  try {
    const r = await S.sample.json([
      inventoryText(),
      '',
      mealsText(14),
      '',
      kitchenText(),
      '',
      '"' + it.name + '"(id ' + it.id + ')를 주재료로 만들 수 있는 1인분 요리를 5가지 골라 줘. 냉장고의 다른 재료를 적극 함께 쓰고, 기한이 가까운 재료가 있으면 우선 써. ' + SEASON,
      '국·찌개, 볶음, 면, 밥, 간단한 반찬처럼 조리법이 서로 겹치지 않게 다양하게. ' + AVOID + (shown.length ? ' 이미 보여준 ' + shown.join(', ') + ' 말고 새 메뉴로.' : ''),
      '다음 JSON 하나만 답해:',
      '{"ideas":[{"name":"메뉴 이름","minutes":15,"level":"쉬움","tool":"주로 쓰는 장비 하나","desc":"어떤 요리인지 한 문장, 20자 안팎","uses":["재고 id", "..."]}]}',
      'uses에는 이 요리에 쓰는 재고 id를 모두 넣고, "' + it.id + '"를 꼭 포함해.'
    ].join('\n'), { cache: false, modelTier: 'quick' });
    const raw = r && Array.isArray(r.ideas) ? r.ideas : [];
    const add = raw.map((x) => ({
      name: String(x.name || '').trim().slice(0, 30), minutes: Number(x.minutes) || null, level: String(x.level || '').slice(0, 6), tool: String(x.tool || '').trim().slice(0, 16), desc: String(x.desc || '').trim().slice(0, 60),
      uses: [...new Set((Array.isArray(x.uses) ? x.uses : []).map(String))].filter((u) => S.items.some((y) => y.id === u))
    })).filter((x) => x.name && !shown.includes(x.name)).slice(0, 5);
    if (!add.length) throw { code: 'empty_completion' };
    S.ideas[id] = { list: (more ? cur.list : []).concat(add), busy: false, err: '' };
  } catch (e) {
    S.ideas[id] = { list: more ? cur.list : [], busy: false, err: e && e.code === 'cancelled' ? '' : errText(e) };
  }
  render();
}

    const evSnap = await S.db.collection('events').get();

$('q-clear').addEventListener('click', () => { S.q = ''; $('q').value = ''; renderSearch(); $('q').focus(); });
$('clear-chat').addEventListener('click', async () => {
  if (S.busy) { S.ctl && S.ctl.abort(); return; }
  if (!S.clearArmed) { S.clearArmed = true; toast('한 번 더 누르면 대화를 지워요. 재고와 기록은 그대로예요.'); setTimeout(() => { S.clearArmed = false; }, 3000); return; }
  S.clearArmed = false; await saveChat([]).catch(() => {}); renderChat();
});
function renderSugs() {
  const list = S.view === 'recipe' ? [['2인분으로', '이 레시피 2인분으로 바꿔 줘'], ['더 간단하게', '이 레시피 더 간단하게 바꿔 줘'], ['다른 재료로', '이 레시피 다른 재료로 바꿔 줘'], ['대체 재료', '이 레시피에서 없을 때 바꿔 쓸 재료 알려 줘']] : [['오늘 뭐 먹지?'], ['냉동실에 뭐 있어?'], ['이번 달에 버린 것'], ['기한 지난 거 정리해 줘']];
  $('sugs').innerHTML = list.map((t) => '<button class="sug glass" data-say="' + esc(t[1] || t[0]) + '">' + esc(t[0]) + '</button>').join('');
}

// ---------- boot ----------
async function boot() {
  show(location.hash.slice(1) || 'home');
  const c = window.claude;
  if (!c || !c.use) { showBanner('이 페이지는 claude.ai에서 열어야 재고가 저장되고 Claude와 대화할 수 있어요.'); renderHome(); return; }
  const [db, sample, dl] = await Promise.all([c.use('db').catch(() => null), c.use('sample').catch(() => null), c.use('downloads').catch(() => null)]);
  S.db = db; S.sample = sample; S.dl = dl;
  if (!db) { showBanner('재고 저장소에 연결하지 못했어요. claude.ai에서 이 페이지를 다시 열어 주세요.'); render(); return; }
  if (sample) {
    try { S.caps = await sample.limits(); } catch (e) { S.caps = null; }
    if (!S.caps || !S.caps.tools) { S.sample = null; }
    $('cam').hidden = !(S.caps && S.caps.images);
    if (S.caps && S.caps.images) $('file').accept = S.caps.images.mediaTypes.join(',');
  }
  if (!S.sample) $('cam').hidden = true;
  subscribe();
  show(S.view);
}
boot();
})();
</script>
